# Deploy the repo's existing static content to GitHub Pages via GitHub Actions.
#
# This repo hosts several independent static sites at the root (maestro/, primal-dashboard/, prs/,
# etc.), each already built and committed. There is NO per-site build step — we just publish the
# whole repo as-is. This replaces the legacy "Deploy from a branch" Jekyll build, which had been
# failing intermittently ("Page build failed") and blocking every deploy.
#
# ONE-TIME OWNER SETTING REQUIRED for this to take effect:
#   Repo Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# (That switch is owner-only and cannot be set via API/token.)
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Publish without running the Vault tests (emergency only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; a newer push CANCELS the older queued/in-progress run
# (cleanly, not as a failure) so rapid-fire deploys don't spam superseded-run failures.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The Vault tab's tests run against the real page before anything is published. A red suite
  # blocks the deploy — previously a push to main went live unchecked. Manual runs can skip it.
  test:
    if: github.event_name == 'push' || inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install
        run: npm i --no-save playwright tailwindcss@3 http-server && npx playwright install --with-deps chromium
      - name: Layout suite (18 checks)
        working-directory: maestro/test
        run: |
          node build-harness.js
          npx tailwindcss -c tailwind.config.js -i tw.in.css -o tw.css --minify
          node test-vault.js
      - name: Behaviour suite (16 checks)
        working-directory: maestro/test
        run: |
          node build-func.js
          npx http-server . -p 8099 -s &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8099/func.html >/dev/null && break; sleep 1; done
          node test-behavior.js
      - name: Keep the screenshots from this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-screenshots
          path: maestro/test/*.png
          if-no-files-found: ignore

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload entire repo as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
