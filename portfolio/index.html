<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Business Cockpit — App Portfolio & Growth</title>
<style>
  :root{
    --bg:#0e1113; --panel:#171b1e; --panel2:#1e2429; --line:#2a3238;
    --ink:#e8edf0; --muted:#95a2ab; --dim:#6b7880;
    --good:#4ea36b; --warn:#d8a33f; --bad:#d8674f; --accent:#5aa9e6; --money:#5fc98a;
    --track:#232a30;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{padding:28px 24px 8px;max-width:1180px;margin:0 auto}
  h1{font-size:22px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);margin-top:4px;font-size:13px}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 24px 60px}
  .banner{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin:14px 0;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

  /* --- portfolio overview strip --- */
  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 6px}
  .otile{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;min-width:0}
  .otile .ok{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .otile .ov{font-size:26px;font-weight:700;margin-top:4px;line-height:1.15;font-variant-numeric:tabular-nums}
  .otile .ov.money{color:var(--money)}
  .otile .osub{font-size:12px;color:var(--muted);margin-top:3px}
  .otile.opp .ov{font-size:15px;font-weight:650;line-height:1.35}
  .otile.opp .oname{color:var(--accent);font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .card.bizonly{border-color:#31404a}
  .chead{display:flex;gap:12px;align-items:center}
  .icon{width:44px;height:44px;border-radius:10px;background:var(--panel2);object-fit:cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--dim);font-size:15px}
  .nm{font-size:16px;font-weight:600}
  .tg{color:var(--dim);font-size:12px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .badge.live{color:var(--good);border-color:#2c4a38}
  .badge.pre{color:var(--warn);border-color:#4a4029}
  .badge.earn{color:var(--money);border-color:#2c4a38}
  .badge.noph{color:var(--dim)}
  .row{display:flex;gap:14px}
  .stat{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:20px;font-weight:650;margin-top:2px}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:500}
  .sec{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:2px 0}
  .bars{display:flex;flex-direction:column;gap:7px}
  .fstep{display:grid;grid-template-columns:96px 1fr 42px;gap:8px;align-items:center;font-size:12px}
  .fstep .lbl{color:var(--muted)}
  .ftrack{height:16px;background:var(--track);border-radius:5px;overflow:hidden}
  .ffill{height:100%;border-radius:5px;background:var(--accent);min-width:2px}
  .fval{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .chart{position:relative;padding-left:26px;margin-top:2px}
  .plot{position:relative;height:66px;margin-top:16px}
  .gl{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
  .gl b{position:absolute;left:-26px;top:-6px;width:22px;text-align:right;font-size:9px;font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
  .spark{display:flex;align-items:flex-end;gap:5px;height:100%;position:relative;z-index:2}
  .sbar{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.9;position:relative}
  .sval{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:10px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
  .xlab{display:flex;gap:5px;margin-top:5px}
  .xlab div{flex:1;text-align:center;font-size:10px;color:var(--dim)}
  .read{border-left:3px solid var(--warn);background:var(--panel2);border-radius:0 8px 8px 0;padding:10px 12px}
  .read .w{font-weight:600;font-size:13px}
  .read .l{color:var(--muted);font-size:12.5px;margin-top:3px}
  .read .l b{color:var(--accent);font-weight:600}
  .empty{color:var(--dim);font-size:12.5px;padding:6px 0}
  a.store{color:var(--accent);text-decoration:none;font-size:12px}
  .foot{color:var(--dim);font-size:12px;margin-top:22px;text-align:center}
  .loading{color:var(--muted);padding:40px 0;text-align:center}
  .stars{color:var(--warn);letter-spacing:1px}

  /* --- business layer --- */
  .biz{border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
  .biz .sec{margin-bottom:8px}
  .bizgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bcell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
  .bcell.wide{grid-column:1 / -1}
  .bcell .bk{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .bcell .bv{font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.45}
  .bcell .bv.money{color:var(--money);font-weight:600}
  .bcell.next{border-color:#3a4a40;background:#18201b}
  .bcell.next .bv{color:#d6efdd}
  .sectitle{font-size:13px;color:var(--muted);letter-spacing:.3px;margin:30px 0 2px;font-weight:600;
    border-top:1px solid var(--line);padding-top:22px}
  .sectitle span{color:var(--dim);font-weight:400}

  @media (max-width:720px){
    .overview{grid-template-columns:1fr 1fr}
    .otile.opp{grid-column:1 / -1}
    .wrap{padding:12px 16px 60px}
    header{padding:22px 16px 6px}
    .bizgrid{grid-template-columns:1fr}
    .bcell.wide{grid-column:auto}
  }
</style>
</head>
<body>
<header>
  <h1>Business Cockpit</h1>
  <div class="sub">Every project through one lens — what ships, what earns, and the next move. App metrics are real users only (dogfooding device &amp; simulators excluded); the business layer is the live master monetization tracker.</div>
</header>
<div class="wrap">
  <div id="overview" class="overview"></div>
  <div id="asc" class="banner"><span class="dot" style="background:var(--dim)"></span><span>Loading…</span></div>
  <div id="grid" class="grid"><div class="loading">Fetching live data…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const FN = "https://cixmyhdzzbgbltmitzkb.supabase.co/functions/v1/portfolio-stats";
// PAPPY is an internal backend service, not a public consumer app — never show app-store/download stats.
// It DOES appear in the business layer (a key revenue opportunity) as a business-only card.
const HIDDEN_APP_KEYS = new Set(["pappy"]);
// The single biggest open opportunity to headline in the overview strip.
const PRIORITY_OPP_KEY = "pappy";
const esc = (s)=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtDate = (iso)=>{try{return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch{return iso}};

function stars(r){const f=Math.round(r);return "★".repeat(f)+"☆".repeat(5-f);}

// A project is "earning" if its current revenue reads as active income (not $0 / pre-revenue).
function isEarning(cur){
  const c=String(cur||"").trim().toLowerCase();
  if(!c) return false;
  if(c.startsWith("$0")||c.startsWith("~$0")||c.startsWith("none")) return false;
  return c.startsWith("active")||c.startsWith("partial");
}
// A next-action counts as "open" unless it's explicitly a non-action ("None...").
function isOpenAction(a){
  const c=String(a||"").trim().toLowerCase();
  return c && !c.startsWith("none");
}

function funnelRows(app){
  const ph=app.posthog; if(!ph) return "";
  const steps=[
    ["Installs", ph.funnel.install],
    ["Onboarded", ph.funnel.onboarding],
    ["Activated", ph.funnel.activation],
  ];
  const max=Math.max(1,...steps.map(s=>s[1]));
  return `<div class="sec">Activation funnel · install → onboarding → ${esc(app.activationLabel||"first action")}</div>
  <div class="bars">${steps.map(([l,v])=>{
    const pct=Math.round(v/max*100);
    return `<div class="fstep"><div class="lbl">${esc(l)}</div><div class="ftrack"><div class="ffill" style="width:${pct}%"></div></div><div class="fval">${v}</div></div>`;
  }).join("")}</div>`;
}

function sparkline(ph){
  if(!ph||!ph.weeklyInstalls||!ph.weeklyInstalls.length) return "";
  const w=ph.weeklyInstalls;
  const max=Math.max(1,...w.map(x=>x.installs));
  const ticks=[...new Set([0,Math.round(max/2),max])];
  const grid=ticks.map(t=>`<div class="gl" style="bottom:${(t/max*100).toFixed(1)}%"><b>${t}</b></div>`).join("");
  const bars=w.map(x=>{
    const h=Math.round(x.installs/max*100);
    return `<div class="sbar" style="height:${h}%" title="${x.installs}"><span class="sval">${x.installs}</span></div>`;
  }).join("");
  return `<div class="sec">Weekly installs</div>
    <div class="chart">
      <div class="plot">${grid}<div class="spark">${bars}</div></div>
      <div class="xlab">${w.map(x=>`<div>${(x.week||"").slice(5)}</div>`).join("")}</div>
    </div>`;
}

// --- business section (shared by app cards + business-only cards) ---
function bizSection(g){
  if(!g) return "";
  const earn=isEarning(g.current_mrr_or_revenue);
  const cell=(k,v,cls="")=> v ? `<div class="bcell ${cls}"><div class="bk">${esc(k)}</div><div class="bv">${esc(v)}</div></div>` : "";
  return `<div class="biz">
    <div class="sec">Business</div>
    <div class="bizgrid">
      <div class="bcell"><div class="bk">Current $</div><div class="bv ${earn?'money':''}">${esc(g.current_mrr_or_revenue||"—")}</div></div>
      ${cell("Funnel stage", g.funnel_stage)}
      ${cell("Revenue model", g.revenue_model, "wide")}
      ${cell("#1 opportunity", g.top_opportunity, "wide")}
      ${cell("Lever", g.lever, "wide")}
      ${g.next_action?`<div class="bcell wide next"><div class="bk">Next action</div><div class="bv">${esc(g.next_action)}</div></div>`:""}
    </div>
  </div>`;
}

// --- app card (real app-store / PostHog metrics) + business layer ---
function appCard(app, g){
  const s=app.appStore;
  const badges=[];
  if(app.onAppStore) badges.push(`<span class="badge live">On App Store</span>`);
  else badges.push(`<span class="badge pre">Pre-launch</span>`);
  if(app.hasPostHog) badges.push(`<span class="badge">PostHog</span>`);
  else badges.push(`<span class="badge noph">No analytics</span>`);

  let body="";
  if(s){
    body += `<div class="row">
      <div class="stat"><div class="k">Version</div><div class="v" style="font-size:16px">${esc(s.version)}</div></div>
      <div class="stat"><div class="k">Rating</div><div class="v"><span class="stars">${stars(s.rating)}</span> <small>${s.ratingCount} review${s.ratingCount===1?"":"s"}</small></div></div>
    </div>`;
  }
  if(app.hasPostHog && app.posthog){
    const ph=app.posthog;
    if(ph.installs>0){
      body += `<div class="row">
        <div class="stat"><div class="k">Real installs</div><div class="v">${ph.installs}</div></div>
        <div class="stat"><div class="k">Returned</div><div class="v">${Math.round(ph.retentionReturnRate*100)}%<small> of installers</small></div></div>
      </div>`;
      body += sparkline(ph);
      body += funnelRows(app);
    } else {
      body += `<div class="empty">Instrumented, but no real installs recorded yet.</div>`;
    }
  } else if(!app.hasPostHog && s){
    body += `<div class="empty">No in-app analytics yet — showing public App Store data only.</div>`;
  }
  if(!s){
    body += `<div class="empty">Not published to the App Store yet — no public metrics available.</div>`;
  }

  const gr=app.growthRead||{};
  const read = (gr.weakSpot||gr.lever) ? `<div class="read"><div class="w">${esc(gr.weakSpot||"")}</div><div class="l"><b>Lever:</b> ${esc(gr.lever||"")}</div></div>` : "";

  const iconImg = s&&s.icon? `<img class="icon" src="${esc(s.icon)}" alt="">` : `<div class="icon">${esc((app.name||"?").slice(0,2))}</div>`;
  const storeLink = s? `<a class="store" href="${esc(s.url)}" target="_blank" rel="noopener">View on App Store ↗</a>`:"";

  return `<div class="card">
    <div class="chead">${iconImg}
      <div><div class="nm">${esc(app.name)}</div><div class="tg">${esc(app.tagline)}</div></div>
      <div class="badges">${badges.join("")}</div>
    </div>
    ${body}
    ${read}
    ${bizSection(g)}
    ${storeLink}
  </div>`;
}

// --- business-only card (non-app projects: consulting, clients, services, podcast) ---
function bizKind(g){
  const k=String(g.project_key||"");
  if(["irons-design","maestro","attunement","command-center","irons-holistic","content"].includes(k)) return "Tool/Service";
  if(["primal","cafe-pos","cameron-podcast","locklear","local-guides"].includes(k)) return "Client";
  if(k==="prs") return "Podcast";
  if(k==="pappy"||k==="primal-agent") return "Service";
  if(k==="scandals") return "R&D";
  return "Business";
}
function bizCard(g){
  const earn=isEarning(g.current_mrr_or_revenue);
  const badges=[];
  badges.push(earn?`<span class="badge earn">Earning</span>`:`<span class="badge pre">Pre-revenue</span>`);
  badges.push(g.is_app?`<span class="badge">App</span>`:`<span class="badge">${esc(bizKind(g))}</span>`);
  const initials=esc((g.display_name||"?").replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase());
  return `<div class="card bizonly">
    <div class="chead"><div class="icon">${initials}</div>
      <div><div class="nm">${esc(g.display_name)}</div><div class="tg">${esc(String(g.revenue_model||"").slice(0,60))}</div></div>
      <div class="badges">${badges.join("")}</div>
    </div>
    ${bizSection(g)}
  </div>`;
}

// --- portfolio overview strip ---
function overview(gt){
  const earning=gt.filter(g=>isEarning(g.current_mrr_or_revenue));
  const openActions=gt.filter(g=>isOpenAction(g.next_action));
  const opp=gt.find(g=>g.project_key===PRIORITY_OPP_KEY) || gt[0] || {};
  const nm=(s)=>String(s||"").replace(/\s*\(.*\)/,"");
  return `
    <div class="otile">
      <div class="ok">Recurring MRR</div>
      <div class="ov money">$0</div>
      <div class="osub">No subscriptions live yet — income is project-based consulting</div>
    </div>
    <div class="otile">
      <div class="ok">Projects earning</div>
      <div class="ov">${earning.length}<small style="font-size:14px;color:var(--muted)"> / ${gt.length}</small></div>
      <div class="osub">${esc(earning.map(g=>nm(g.display_name)).join(", ")||"—")}</div>
    </div>
    <div class="otile opp">
      <div class="ok">Biggest open opportunity</div>
      <div class="ov"><span class="oname">${esc(nm(opp.display_name))}:</span> ${esc(opp.top_opportunity||"—")}</div>
    </div>
    <div class="otile">
      <div class="ok">Open next-actions</div>
      <div class="ov">${openActions.length}</div>
      <div class="osub">Concrete moves queued across the portfolio</div>
    </div>`;
}

(async ()=>{
  try{
    const r=await fetch(FN);
    const d=await r.json();
    const gt=(d.growthTracker||[]);
    const byKey=Object.fromEntries(gt.map(g=>[String(g.project_key).toLowerCase(),g]));

    if(gt.length) document.getElementById("overview").innerHTML = overview(gt);

    const asc=d.appStoreConnect||{};
    const ab=document.getElementById("asc");
    ab.innerHTML = `<span class="dot" style="background:${asc.connected?"var(--good)":"var(--warn)"}"></span>
      <span>${asc.connected? "App Store Connect connected — real download counts available." : esc(asc.note||"App Store Connect not connected.")}</span>`;

    const apps=(d.apps||[]).filter(a => !HIDDEN_APP_KEYS.has(String(a.key||"").toLowerCase()) && String(a.name||"").toUpperCase() !== "PAPPY");
    const appKeys=new Set(apps.map(a=>String(a.key||"").toLowerCase()));
    const appHtml=apps.map(a=>appCard(a, byKey[String(a.key||"").toLowerCase()])).join("");

    const bizRows=gt.filter(g=>!appKeys.has(String(g.project_key).toLowerCase()));
    const bizHtml=bizRows.map(bizCard).join("");

    document.getElementById("grid").innerHTML =
      appHtml +
      (bizRows.length? `<div class="sectitle" style="grid-column:1 / -1">Business layer <span>· consulting, clients, services &amp; content — the actual income engine and its opportunities</span></div>` : "") +
      bizHtml;

    document.getElementById("foot").textContent =
      `Live data · generated ${fmtDate(d.generatedAt)} · app metrics exclude dev device ${d.exclusions.devDistinctIdPrefix}… and ${d.exclusions.simulatorModels.join(" / ")} simulators · business layer from master monetization tracker`;
  }catch(e){
    document.getElementById("grid").innerHTML = `<div class="loading">Failed to load: ${esc(String(e))}</div>`;
  }
})();
</script>
</body>
</html>
