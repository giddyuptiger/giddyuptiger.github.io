<!DOCTYPE html>
<html class="dark" lang="en"><head><meta charset="UTF-8">
<title>Brain render test</title>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
<style>html,body{margin:0;height:100%;background:#0a0c10;font-family:system-ui}#c{position:fixed;inset:0}#s{position:fixed;top:10px;left:10px;color:#C5E45C;font:600 13px system-ui;z-index:9;background:rgba(14,16,20,.7);padding:8px 12px;border-radius:8px}</style>
</head><body>
<div id="c"></div><div id="s">booting…</div>
<script type="module">
const PAL=["#7aa2f7","#9ece6a","#f7768e","#e0af68","#bb9af7","#2ac3de","#ff9e64","#73daca","#c0caf5","#ff75a0"];
const groups=["root","Projects/Futon","Projects/maestro","Projects/grdn","Knowledge","methodology","archive","Projects/primal"];
function color(g){ if(g==="root")return "#C5E45C"; let h=0;for(const ch of g)h=(h*31+ch.charCodeAt(0))>>>0; return PAL[h%PAL.length]; }
// synthetic vault: 1 hub + 800 nodes in groups, tree edges to hub or group-parents + a few wiki links
const nodes=[{id:"INDEX.md",name:"INDEX.md",group:"root",deg:0}];
const parents={};
groups.slice(1).forEach((g,i)=>{ const id="hub-"+i; nodes.push({id,name:g.split("/").pop()+" README.md",group:g,deg:0}); parents[g]=id; });
const links=[];
nodes.slice(1).forEach(n=>links.push({source:"INDEX.md",target:n.id,kind:"folder"}));
for(let i=0;i<800;i++){ const g=groups[1+(i%(groups.length-1))]; const id="n"+i; nodes.push({id,name:"note-"+i+".md",group:g,deg:0}); links.push({source:parents[g],target:id,kind:"folder"}); }
for(let i=0;i<40;i++){ const a=nodes[50+i].id,b=nodes[400+i].id; links.push({source:a,target:b,kind:"wiki"}); }
const byId={}; nodes.forEach(n=>byId[n.id]=n); links.forEach(l=>{byId[l.source].deg++;byId[l.target].deg++;});
const hub=new Set(nodes.slice().sort((a,b)=>b.deg-a.deg).slice(0,20).map(n=>n.id));
const G=window.ForceGraph3D({controlType:"orbit"})(document.getElementById("c"))
  .backgroundColor("#0a0c10").graphData({nodes,links}).nodeId("id")
  .nodeVal(n=>1.2+Math.sqrt(n.deg)*1.3).nodeColor(n=>color(n.group)).nodeOpacity(.92).nodeRelSize(3.4)
  .linkColor(l=>l.kind==="wiki"?"rgba(197,228,92,.55)":"rgba(150,162,176,.12)")
  .linkWidth(l=>l.kind==="wiki"?.7:.35).linkDirectionalParticles(l=>l.kind==="wiki"?2:0).linkDirectionalParticleWidth(1.5)
  .warmupTicks(30).cooldownTicks(200);
G.width(innerWidth).height(innerHeight);
const c=G.controls(); c.autoRotate=true; c.autoRotateSpeed=.6; c.enableDamping=true;
let ok={bloom:false,labels:false};
try{ const {UnrealBloomPass}=await import("https://esm.sh/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js");
  const b=new UnrealBloomPass(); b.strength=1.05;b.radius=.8;b.threshold=.03; G.postProcessingComposer().addPass(b); ok.bloom=true; }catch(e){ console.error("bloom",e); }
try{ const SpriteText=(await import("https://esm.sh/three-spritetext@1.9.6")).default;
  G.nodeThreeObjectExtend(true).nodeThreeObject(n=>{ if(!hub.has(n.id))return null; const s=new SpriteText(n.name.replace(/\.md$/,"")); s.color="#eef2ea"; s.textHeight=5.5; s.material.depthWrite=false; s.position.set(0,7+Math.sqrt(n.deg),0); return s; }); ok.labels=true; }catch(e){ console.error("labels",e); }
setTimeout(()=>{ document.getElementById("s").textContent=`TEST OK · ${nodes.length} nodes · ${links.length} links · bloom:${ok.bloom} · labels:${ok.labels}`; window.__brainTestDone=true; }, 2500);
</script></body></html>
