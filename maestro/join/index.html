<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro — Your vault, alive.</title>
<meta name="description" content="Maestro is the second brain that maintains itself — same markdown, same [[links]], connected directly to Claude.">
<meta property="og:title" content="Maestro — Your vault, alive.">
<meta property="og:description" content="The second brain that maintains itself. Same markdown, same [[links]], connected directly to Claude.">
<meta property="og:type" content="website">
<style>
  :root{ --bg:#05060a; --ink:#e8eaed; --dim:#9ba1a6; --lime:#C5E45C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,'Helvetica Neue',sans-serif; }
  #brain{ position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  .wrap{ position:relative; z-index:1; min-height:100svh; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    padding:48px 24px; text-align:center; }
  h1{ font-weight:800; font-size:clamp(40px,8vw,76px); letter-spacing:.30em;
    padding-left:.30em; /* optical centering vs tracking */ }
  .tag{ margin-top:14px; font-size:clamp(18px,3vw,24px); color:var(--ink); font-weight:500; }
  .sub{ margin-top:14px; max-width:560px; font-size:clamp(15px,2.4vw,17px);
    line-height:1.55; color:var(--dim); }
  .sub b{ color:var(--ink); font-weight:600; }
  form{ margin-top:34px; display:flex; gap:10px; width:100%; max-width:460px; }
  input[type=email]{ flex:1; min-width:0; height:54px; border-radius:27px;
    border:1px solid rgba(155,161,166,.35); background:rgba(14,16,20,.88);
    color:var(--ink); font-size:16px; padding:0 20px; outline:none; }
  input[type=email]:focus{ border-color:var(--lime); }
  button{ height:54px; border-radius:27px; border:0; background:var(--lime);
    color:#0b0d12; font-size:16px; font-weight:600; padding:0 24px;
    cursor:pointer; white-space:nowrap; }
  button:disabled{ opacity:.6; cursor:default; }
  .hp{ position:absolute; left:-9999px; opacity:0; }
  #msg{ margin-top:16px; min-height:24px; font-size:15px; color:var(--dim); }
  #msg.ok{ color:var(--lime); font-weight:600; }
  .fine{ margin-top:26px; font-size:13px; color:rgba(155,161,166,.75); }
  .film{ position:relative; z-index:1; padding:24px 24px 72px; display:flex; justify-content:center; }
  video{ width:100%; max-width:860px; border-radius:16px;
    border:1px solid rgba(155,161,166,.18); display:block; }
  @media (max-width:520px){ form{ flex-direction:column; } button{ width:100%; } }
</style>
</head>
<body>
<canvas id="brain"></canvas>

<div class="wrap">
  <h1>MAESTRO</h1>
  <div class="tag">Your vault, alive.</div>
  <p class="sub">The second brain that maintains itself — <b>same markdown, same [[links]]</b>,
     connected directly to Claude. It reads, writes, files, and links your notes for you.</p>
  <form id="f" novalidate>
    <input id="email" type="email" placeholder="you@email.com" autocomplete="email" required>
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">
    <button id="btn" type="submit">Join the waitlist</button>
  </form>
  <div id="msg"></div>
  <div class="fine">No spam — a few updates as early access opens. Bring your existing vault when it does.</div>
</div>

<div class="film">
  <video src="film.mp4" controls muted autoplay loop playsinline></video>
</div>

<script>
/* ── live brain — a lightweight cousin of the product's Brain tab ── */
(function(){
  const cv=document.getElementById("brain"), ctx=cv.getContext("2d");
  let W,H; const fit=()=>{ W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio; };
  fit(); addEventListener("resize",fit);
  let s=305441741; const rnd=()=>{ s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0; return s/4294967296; };
  const rr=(a,b)=>a+rnd()*(b-a), ga=()=>(rnd()+rnd()+rnd()+rnd()-2)*1.2;
  const PAL=["#7aa2f7","#9ece6a","#bb9af7","#e0af68","#f7768e","#2ac3de","#ff9e64","#73daca"];
  const nodes=[],edges=[],hubs=[];
  const root={x:0,y:0,z:0,r:8,c:"#C5E45C"}; nodes.push(root);
  PAL.forEach((c,ci)=>{
    const az=ci/PAL.length*6.283+.35+rr(-.12,.12), el=rr(-.55,.55), R=rr(200,240);
    const h={x:R*Math.cos(el)*Math.cos(az),y:R*Math.sin(el)*.85,z:R*Math.cos(el)*Math.sin(az),r:6,c:c};
    nodes.push(h);hubs.push(h);edges.push([root,h,0]);
    for(let i=0;i<10;i++){ const m={x:h.x+ga()*55,y:h.y+ga()*46,z:h.z+ga()*55,r:rr(2.6,4.6),c:c};
      nodes.push(m); edges.push([h,m,0]); }
  });
  for(let i=0;i<14;i++){ const a=nodes[1+(rnd()*(nodes.length-1)|0)],b=nodes[1+(rnd()*(nodes.length-1)|0)];
    if(a!==b) edges.push([a,b,1]); }
  function draw(now){
    const t=now/1000, yaw=t*.07, cy=Math.cos(yaw), sy=Math.sin(yaw);
    const pitch=.24, cp=Math.cos(pitch), sp=Math.sin(pitch);
    const D=Math.max(620, 900 - Math.min(W,H)/devicePixelRatio*0.15), F=.62*Math.min(W,H)+260;
    ctx.fillStyle="#05060a"; ctx.fillRect(0,0,W,H);
    const P=nodes.map(n=>{ let x=n.x*cy+n.z*sy, z=-n.x*sy+n.z*cy, y=n.y;
      const y2=y*cp-z*sp, z2=y*sp+z*cp, sc=F/(D-z2);
      return {x:W/2+x*sc, y:H*0.44-y2*sc, s:sc}; });
    ctx.lineWidth=1*devicePixelRatio; ctx.globalAlpha=1;
    edges.forEach(([a,b,k])=>{ const A=P[nodes.indexOf(a)],B=P[nodes.indexOf(b)];
      ctx.strokeStyle=k?"rgba(197,228,92,0.20)":"rgba(150,162,176,0.10)";
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke(); });
    ctx.globalCompositeOperation="lighter";
    nodes.forEach((n,i)=>{ const p=P[i], R=n.r*p.s*devicePixelRatio*.9;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*3.2);
      g.addColorStop(0,n.c+"55"); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,R*3.2,0,6.283); ctx.fill();
      ctx.fillStyle=n.c; ctx.globalAlpha=.85; ctx.beginPath(); ctx.arc(p.x,p.y,R,0,6.283); ctx.fill();
      ctx.globalAlpha=1; });
    ctx.globalCompositeOperation="source-over";
    /* soft veil so the type stays readable */
    ctx.fillStyle="rgba(5,6,10,0.45)"; ctx.fillRect(0,0,W,H);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ── waitlist form → Supabase (anon key is public by design; RLS = insert-only) ── */
const SB_URL="https://cixmyhdzzbgbltmitzkb.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpeG15aGR6emJnYmx0bWl0emtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjYxMzEsImV4cCI6MjA5NjAwMjEzMX0.vjWESdexsMOLlqRAQXTV81gQ709ZN3v_K6HgtjCtulY";
const f=document.getElementById("f"), msg=document.getElementById("msg"),
      btn=document.getElementById("btn"), em=document.getElementById("email");
f.addEventListener("submit", async e=>{
  e.preventDefault();
  const email=em.value.trim().toLowerCase();
  if(f.querySelector(".hp").value){ msg.className="ok"; msg.textContent="You're on the list."; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ msg.className=""; msg.textContent="That email doesn't look right."; return; }
  btn.disabled=true; msg.className=""; msg.textContent="…";
  const source=new URLSearchParams(location.search).get("s")||null;
  try{
    const r=await fetch(SB_URL+"/rest/v1/waitlist",{ method:"POST",
      headers:{ "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY,
                "Content-Type":"application/json", "Prefer":"return=minimal" },
      body:JSON.stringify({ email, source }) });
    if(r.status===201){ msg.className="ok"; msg.textContent="You're on the list."; f.reset(); }
    else if(r.status===409){ msg.className="ok"; msg.textContent="You're already on the list."; }
    else{ msg.className=""; msg.textContent="Signups are opening shortly — please try again in a few minutes."; btn.disabled=false; }
  }catch(_){ msg.className=""; msg.textContent="Network hiccup — try again."; btn.disabled=false; }
});
</script>
</body>
</html>
