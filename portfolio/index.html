<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>App Portfolio — Command Center</title>
<style>
  :root{
    --bg:#0e1113; --panel:#171b1e; --panel2:#1e2429; --line:#2a3238;
    --ink:#e8edf0; --muted:#95a2ab; --dim:#6b7880;
    --good:#4ea36b; --warn:#d8a33f; --bad:#d8674f; --accent:#5aa9e6;
    --track:#232a30;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{padding:28px 24px 8px;max-width:1180px;margin:0 auto}
  h1{font-size:22px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);margin-top:4px;font-size:13px}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 24px 60px}
  .banner{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin:14px 0;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .chead{display:flex;gap:12px;align-items:center}
  .icon{width:44px;height:44px;border-radius:10px;background:var(--panel2);object-fit:cover;flex:0 0 auto}
  .nm{font-size:16px;font-weight:600}
  .tg{color:var(--dim);font-size:12px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .badge.live{color:var(--good);border-color:#2c4a38}
  .badge.pre{color:var(--warn);border-color:#4a4029}
  .badge.noph{color:var(--dim)}
  .row{display:flex;gap:14px}
  .stat{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:20px;font-weight:650;margin-top:2px}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:500}
  .sec{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:2px 0}
  .bars{display:flex;flex-direction:column;gap:7px}
  .fstep{display:grid;grid-template-columns:96px 1fr 42px;gap:8px;align-items:center;font-size:12px}
  .fstep .lbl{color:var(--muted)}
  .ftrack{height:16px;background:var(--track);border-radius:5px;overflow:hidden}
  .ffill{height:100%;border-radius:5px;background:var(--accent);min-width:2px}
  .fval{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .chart{position:relative;padding-left:26px;margin-top:2px}
  .plot{position:relative;height:66px;margin-top:16px}
  .gl{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
  .gl b{position:absolute;left:-26px;top:-6px;width:22px;text-align:right;font-size:9px;font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
  .spark{display:flex;align-items:flex-end;gap:5px;height:100%;position:relative;z-index:2}
  .sbar{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.9;position:relative}
  .sval{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:10px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
  .xlab{display:flex;gap:5px;margin-top:5px}
  .xlab div{flex:1;text-align:center;font-size:10px;color:var(--dim)}
  .read{border-left:3px solid var(--warn);background:var(--panel2);border-radius:0 8px 8px 0;padding:10px 12px}
  .read .w{font-weight:600;font-size:13px}
  .read .l{color:var(--muted);font-size:12.5px;margin-top:3px}
  .read .l b{color:var(--accent);font-weight:600}
  .empty{color:var(--dim);font-size:12.5px;padding:6px 0}
  a.store{color:var(--accent);text-decoration:none;font-size:12px}
  .foot{color:var(--dim);font-size:12px;margin-top:22px;text-align:center}
  .loading{color:var(--muted);padding:40px 0;text-align:center}
  .stars{color:var(--warn);letter-spacing:1px}
</style>
</head>
<body>
<header>
  <h1>App Portfolio</h1>
  <div class="sub">One place for every app — installs, ratings, engagement, and what to fix next. Real users only (dogfooding device &amp; simulators excluded).</div>
</header>
<div class="wrap">
  <div id="asc" class="banner"><span class="dot" style="background:var(--dim)"></span><span>Loading…</span></div>
  <div id="grid" class="grid"><div class="loading">Fetching live data…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const FN = "https://cixmyhdzzbgbltmitzkb.supabase.co/functions/v1/portfolio-stats";
const esc = (s)=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtDate = (iso)=>{try{return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch{return iso}};

function stars(r){const f=Math.round(r);return "★".repeat(f)+"☆".repeat(5-f);}

function funnelRows(app){
  const ph=app.posthog; if(!ph) return "";
  const steps=[
    ["Installs", ph.funnel.install],
    ["Onboarded", ph.funnel.onboarding],
    [app.activationLabel? "Activated":"Activated", ph.funnel.activation],
  ];
  const max=Math.max(1,...steps.map(s=>s[1]));
  return `<div class="sec">Activation funnel · install → onboarding → ${esc(app.activationLabel||"first action")}</div>
  <div class="bars">${steps.map(([l,v])=>{
    const pct=Math.round(v/max*100);
    return `<div class="fstep"><div class="lbl">${esc(l)}</div><div class="ftrack"><div class="ffill" style="width:${pct}%"></div></div><div class="fval">${v}</div></div>`;
  }).join("")}</div>`;
}

function sparkline(ph){
  if(!ph||!ph.weeklyInstalls||!ph.weeklyInstalls.length) return "";
  const w=ph.weeklyInstalls;
  const max=Math.max(1,...w.map(x=>x.installs));
  // Subtle Y-axis: gridline ticks at 0, mid, and max (positioned by actual value).
  const ticks=[...new Set([0,Math.round(max/2),max])];
  const grid=ticks.map(t=>`<div class="gl" style="bottom:${(t/max*100).toFixed(1)}%"><b>${t}</b></div>`).join("");
  const bars=w.map(x=>{
    const h=Math.round(x.installs/max*100);
    return `<div class="sbar" style="height:${h}%" title="${x.installs}"><span class="sval">${x.installs}</span></div>`;
  }).join("");
  return `<div class="sec">Weekly installs</div>
    <div class="chart">
      <div class="plot">${grid}<div class="spark">${bars}</div></div>
      <div class="xlab">${w.map(x=>`<div>${(x.week||"").slice(5)}</div>`).join("")}</div>
    </div>`;
}

function card(app){
  const s=app.appStore;
  const live = app.onAppStore;
  const badges=[];
  if(live) badges.push(`<span class="badge live">On App Store</span>`);
  else if(app.notAnApp) badges.push(`<span class="badge">Service</span>`);
  else badges.push(`<span class="badge pre">Pre-launch</span>`);
  if(app.hasPostHog) badges.push(`<span class="badge">PostHog</span>`);
  else if(!app.notAnApp) badges.push(`<span class="badge noph">No analytics</span>`);

  let body="";
  if(s){
    body += `<div class="row">
      <div class="stat"><div class="k">Version</div><div class="v" style="font-size:16px">${esc(s.version)}</div></div>
      <div class="stat"><div class="k">Rating</div><div class="v"><span class="stars">${stars(s.rating)}</span> <small>${s.ratingCount} review${s.ratingCount===1?"":"s"}</small></div></div>
    </div>`;
  }
  if(app.hasPostHog && app.posthog){
    const ph=app.posthog;
    if(ph.installs>0){
      body += `<div class="row">
        <div class="stat"><div class="k">Real installs</div><div class="v">${ph.installs}</div></div>
        <div class="stat"><div class="k">Returned</div><div class="v">${Math.round(ph.retentionReturnRate*100)}%<small> of installers</small></div></div>
      </div>`;
      body += sparkline(ph);
      body += funnelRows(app);
    } else {
      body += `<div class="empty">Instrumented, but no real installs recorded yet.</div>`;
    }
  } else if(!app.notAnApp && !app.hasPostHog && s){
    body += `<div class="empty">No in-app analytics yet — showing public App Store data only.</div>`;
  } else if(app.notAnApp){
    body += `<div class="empty">Backend fulfillment service — not distributed on the App Store.</div>`;
  }
  if(!s && !app.notAnApp){
    body += `<div class="empty">Not published to the App Store yet — no public metrics available.</div>`;
  }

  const gr=app.growthRead||{};
  const read = `<div class="read"><div class="w">${esc(gr.weakSpot||"")}</div><div class="l"><b>Lever:</b> ${esc(gr.lever||"")}</div></div>`;

  const iconImg = s&&s.icon? `<img class="icon" src="${esc(s.icon)}" alt="">` : `<div class="icon"></div>`;
  const storeLink = s? `<a class="store" href="${esc(s.url)}" target="_blank" rel="noopener">View on App Store ↗</a>`:"";

  return `<div class="card">
    <div class="chead">${iconImg}
      <div><div class="nm">${esc(app.name)}</div><div class="tg">${esc(app.tagline)}</div></div>
      <div class="badges">${badges.join("")}</div>
    </div>
    ${body}
    ${read}
    ${storeLink}
  </div>`;
}

(async ()=>{
  try{
    const r=await fetch(FN);
    const d=await r.json();
    // ASC banner
    const asc=d.appStoreConnect||{};
    const ab=document.getElementById("asc");
    ab.innerHTML = `<span class="dot" style="background:${asc.connected?"var(--good)":"var(--warn)"}"></span>
      <span>${asc.connected? "App Store Connect connected — real download counts available." : esc(asc.note||"App Store Connect not connected.")}</span>`;
    // cards
    document.getElementById("grid").innerHTML = (d.apps||[]).map(card).join("");
    document.getElementById("foot").textContent =
      `Live data · generated ${fmtDate(d.generatedAt)} · excludes dev device ${d.exclusions.devDistinctIdPrefix}… and ${d.exclusions.simulatorModels.join(" / ")} simulators`;
  }catch(e){
    document.getElementById("grid").innerHTML = `<div class="loading">Failed to load: ${esc(String(e))}</div>`;
  }
})();
</script>
</body>
</html>
